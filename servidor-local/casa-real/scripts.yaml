# Roteiros de comando: pulso de 1 s no registrador correspondente.
# HR130 Sono | HR131 Manhã | HR132 Foco | HR133 Calmante
# HR134 Verificação | HR135 Persiana sobe | HR136 Persiana desce

pulso_registrador:
  mode: queued
  fields:
    registrador:
      description: "Endereço do holding register (130 a 136)"
  sequence:
    - service: modbus.write_register
      data:
        hub: logo1
        address: "{{ registrador }}"
        value: 1
    - delay: "00:00:01"
    - service: modbus.write_register
      data:
        hub: logo1
        address: "{{ registrador }}"
        value: 0

cena_sono:
  alias: Boa noite
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 130 }

cena_manha:
  alias: Bom dia
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 131 }

cena_foco:
  alias: Modo foco
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 132 }

cena_calmante:
  alias: Modo calma
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 133 }

verificar_casa:
  alias: Verificar a casa
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 134 }

persiana_subir:
  alias: Subir persiana
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 135 }

persiana_descer:
  alias: Descer persiana
  sequence:
    - service: script.pulso_registrador
      data: { registrador: 136 }
