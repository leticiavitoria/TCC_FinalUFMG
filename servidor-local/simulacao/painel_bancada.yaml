title: Bancada
views:
  - title: Demonstração
    path: demonstracao
    type: sections
    theme: casa_escura
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: ENTRADAS DE CAMPO
            heading_style: subtitle
          - type: entities
            grid_options:
              columns: full
            entities:
              - input_boolean.i_porta
              - input_boolean.i_gas
              - input_boolean.i_geladeira
              - input_boolean.m_falha_esp32
              - input_boolean.m_calma_falhou
          - type: heading
            heading: COMANDOS
            heading_style: subtitle
          - type: custom:mushroom-template-card
            primary: Chuva
            icon: mdi:weather-pouring
            color: white
            vertical: true
            tap_action:
              action: call-service
              service: script.chuva_comeca
            icon_tap_action:
              action: call-service
              service: script.chuva_comeca
            grid_options:
              columns: 3
            card_mod:
              style: |
                ha-card {
                  --ha-tile-info-primary-font-size: 15px;
                  background: linear-gradient(145deg, #2B8FD6, #1F6FB0);
                  border: none;
                  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255, 255, 255, 0.9);
                }
          - type: custom:mushroom-template-card
            primary: Sem chuva
            icon: mdi:weather-sunny
            color: white
            vertical: true
            tap_action:
              action: call-service
              service: script.chuva_para
            icon_tap_action:
              action: call-service
              service: script.chuva_para
            grid_options:
              columns: 3
            card_mod:
              style: |
                ha-card {
                  --ha-tile-info-primary-font-size: 15px;
                  background: linear-gradient(145deg, #F2B24A, #C97B16);
                  border: none;
                  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255, 255, 255, 0.9);
                }
          - type: custom:mushroom-template-card
            primary: Pânico
            icon: mdi:alarm-light
            color: white
            vertical: true
            tap_action:
              action: call-service
              service: script.botao_panico
            icon_tap_action:
              action: call-service
              service: script.botao_panico
            grid_options:
              columns: 3
            card_mod:
              style: |
                ha-card {
                  --ha-tile-info-primary-font-size: 15px;
                  background: linear-gradient(145deg, #D64545, #8E1F1F);
                  border: none;
                  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255, 255, 255, 0.9);
                }
          - type: custom:mushroom-template-card
            primary: Reset
            icon: mdi:restart
            color: white
            vertical: true
            tap_action:
              action: call-service
              service: script.reset_emergencia
            icon_tap_action:
              action: call-service
              service: script.reset_emergencia
            grid_options:
              columns: 3
            card_mod:
              style: |
                ha-card {
                  --ha-tile-info-primary-font-size: 15px;
                  background: linear-gradient(145deg, #2C6E7A, #173F4A);
                  border: none;
                  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255, 255, 255, 0.9);
                }
      - type: grid
        cards:
          - type: heading
            heading: A CASA AGORA
            heading_style: subtitle
          - type: picture-elements
            image: data:image/svg+xml;base64,
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  border: none;
                  overflow: hidden;
                  max-width: 380px;
                  margin: 0 auto;
                }
            elements:
              - type: conditional
                conditions:
                  - entity: binary_sensor.detector_de_gas
                    state: "on"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 76.9%
                      top: 20.9%
                      width: 38.2%
              - type: conditional
                conditions:
                  - entity: binary_sensor.porta_da_entrada_aberta
                    state: "on"
                  - entity: binary_sensor.emergencia
                    state: "off"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 76.9%
                      top: 78.0%
                      width: 38.2%
              - type: conditional
                conditions:
                  - entity: binary_sensor.emergencia
                    state: "on"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 50.0%
                      top: 50.0%
                      width: 100.0%
              - type: conditional
                conditions:
                  - entity: binary_sensor.porta_da_entrada_aberta
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:door-open
                    title: Porta da entrada aberta
                    style:
                      left: 64.5%
                      top: 89.3%
                      color: "#FFFFFF"
                      background: "#D98A00"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #D98A0055, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.porta_da_entrada_aberta
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:door-closed
                    title: Porta da entrada fechada
                    style:
                      left: 64.5%
                      top: 89.3%
                      color: "#2E9E5B"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.geladeira_aberta
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:fridge
                    title: Geladeira aberta
                    style:
                      left: 91.6%
                      top: 31.6%
                      color: "#FFFFFF"
                      background: "#D98A00"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #D98A0055, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.geladeira_aberta
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:fridge
                    title: Geladeira fechada
                    style:
                      left: 91.6%
                      top: 31.6%
                      color: "#8A97A0"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.detector_de_gas
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:gas-cylinder
                    title: Vazamento de gás detectado
                    style:
                      left: 73.0%
                      top: 9.4%
                      color: "#FFFFFF"
                      background: "#C0392B"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #C0392B55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.detector_de_gas
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:gas-cylinder
                    title: Detector de gás normal
                    style:
                      left: 73.0%
                      top: 9.4%
                      color: "#2E9E5B"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.gas_aberto
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:valve-open
                    title: Registro do gás aberto
                    style:
                      left: 85.6%
                      top: 9.4%
                      color: "#1F6F78"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.gas_aberto
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:valve-closed
                    title: Registro do gás fechado
                    style:
                      left: 85.6%
                      top: 9.4%
                      color: "#FFFFFF"
                      background: "#3D4F5C"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #3D4F5C55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.persiana_fechada
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:blinds
                    title: Persiana fechada
                    style:
                      left: 14.9%
                      top: 77.8%
                      color: "#FFFFFF"
                      background: "#3D4F5C"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #3D4F5C55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.persiana_fechada
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:blinds-open
                    title: Persiana aberta
                    style:
                      left: 14.9%
                      top: 77.8%
                      color: "#1F6F78"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.chuva
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:weather-pouring
                    title: Chovendo
                    style:
                      left: 4.1%
                      top: 70.9%
                      color: "#FFFFFF"
                      background: "#216EBE"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #216EBE55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.chuva
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:weather-cloudy
                    title: Sem chuva
                    style:
                      left: 4.1%
                      top: 70.9%
                      color: "#8A97A0"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.sirene_externa
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:bullhorn
                    title: Sirene ligada
                    style:
                      left: 85.6%
                      top: 95.7%
                      color: "#FFFFFF"
                      background: "#C0392B"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #C0392B55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.sirene_externa
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:bullhorn-outline
                    title: Sirene desligada
                    style:
                      left: 85.6%
                      top: 95.7%
                      color: "#8A97A0"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.falha_de_esp32
                    state: "on"
                elements:
                  - type: icon
                    icon: mdi:access-point-off
                    title: Nó de monitoramento sem resposta
                    style:
                      left: 67.6%
                      top: 41.9%
                      color: "#FFFFFF"
                      background: "#C0392B"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 0 0 5px #C0392B55, 0 2px 8px rgba(0, 0, 0, 0.45)"
                      "--mdc-icon-size": 30px
              - type: conditional
                conditions:
                  - entity: binary_sensor.falha_de_esp32
                    state: "off"
                elements:
                  - type: icon
                    icon: mdi:access-point
                    title: Nó de monitoramento ativo
                    style:
                      left: 67.6%
                      top: 41.9%
                      color: "#2E9E5B"
                      background: "#FFFFFF"
                      border-radius: 50%
                      padding: 7px
                      box-shadow: "0 1px 5px rgba(30, 42, 50, 0.35)"
                      "--mdc-icon-size": 30px
      - type: grid
        cards:
          - type: markdown
            grid_options:
              columns: full
            content: |
              ## {{ now().strftime('%H:%M') }}
              # {% if is_state('binary_sensor.emergencia','on') %}Emergência na casa{% elif is_state('binary_sensor.cena_sono','on') %}Dormindo{% elif is_state('binary_sensor.cena_manha','on') %}Acordando{% elif is_state('binary_sensor.cena_foco','on') %}Concentrado{% elif is_state('binary_sensor.cena_calmante','on') %}Em modo Calma{% else %}Sem cena ativa{% endif %}
              {% if is_state('binary_sensor.emergencia','on') %}Motivo: {% if is_state('binary_sensor.evento_gas','on') %}vazamento de gás{% elif is_state('binary_sensor.evento_panico','on') %}botão de pânico{% elif is_state('binary_sensor.evento_fumaca','on') %}fumaça ou chama{% elif is_state('binary_sensor.evento_queda','on') %}queda ou crise{% else %}detecção{% endif %}. A cena só encerra com o reset no botão de pânico.{% elif is_state('binary_sensor.calmante_falhou','on') %}O ruído persistiu depois da cena Calma. Não é emergência, mas vale ligar.{% elif is_state('binary_sensor.falha_de_esp32','on') %}Um sensor de queda parou de responder. A detecção está indisponível nesse cômodo.{% else %}Tudo dentro do esperado.{% endif %}
            card_mod:
              style:
                ha-markdown $: |
                  h2 {
                    float: right;
                    font-size: 46px !important;
                    font-weight: 700;
                    line-height: 1.1;
                    margin: 0;
                  }
                  h1 {
                    font-size: 32px !important;
                    font-weight: 700;
                    line-height: 1.15;
                    margin: 0 0 6px 0;
                  }
                  p {
                    font-size: 16px !important;
                    margin: 0;
                    opacity: 0.92;
                  }
                .: |
                  ha-card {
                    background: {% if is_state('binary_sensor.emergencia','on') %}linear-gradient(135deg, #D64545 0%, #8E1F1F 100%){% elif is_state('binary_sensor.calmante_falhou','on') or is_state('binary_sensor.falha_de_esp32','on') %}linear-gradient(135deg, #F2B24A 0%, #C97B16 100%){% else %}linear-gradient(135deg, #2C6E7A 0%, #173F4A 100%){% endif %};
                    color: #FFFFFF;
                    --primary-text-color: #FFFFFF;
                    border: none;
                    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
                    padding: 8px 10px;
                  }
          - type: heading
            heading: SEMÁFORO
            heading_style: subtitle
          - type: picture-elements
            image: data:image/svg+xml;base64,
            grid_options:
              columns: full
            card_mod:
              style: |
                ha-card {
                  background: none;
                  border: none;
                  box-shadow: none;
                }
            elements:
              - type: conditional
                conditions:
                  - entity: binary_sensor.semaforo_verde
                    state: "on"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 19.6%
                      top: 41%
                      width: 28.6%
              - type: conditional
                conditions:
                  - entity: binary_sensor.semaforo_amarelo
                    state: "on"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 50.0%
                      top: 41%
                      width: 28.6%
              - type: conditional
                conditions:
                  - entity: binary_sensor.semaforo_vermelho
                    state: "on"
                elements:
                  - type: image
                    image: data:image/svg+xml;base64,
                    tap_action:
                      action: none
                    style:
                      left: 80.4%
                      top: 41%
                      width: 28.6%
          - type: heading
            heading: ATUADORES
            heading_style: subtitle
          - type: custom:mushroom-template-card
            primary: Sirene
            secondary: "{{ 'Ligada' if is_state('binary_sensor.sirene_externa','on') else 'Desligada' }}"
            icon: mdi:bullhorn
            color: "{{ 'red' if is_state('binary_sensor.sirene_externa','on') else 'grey' }}"
            tap_action:
              action: none
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            primary: Gás
            secondary: "{{ 'Aberto' if is_state('binary_sensor.gas_aberto','on') else 'Fechado' }}"
            icon: mdi:valve
            color: "{{ 'teal' if is_state('binary_sensor.gas_aberto','on') else 'grey' }}"
            tap_action:
              action: none
            grid_options:
              columns: 4
          - type: custom:mushroom-template-card
            primary: Persiana
            secondary: "{{ 'Fechada' if is_state('binary_sensor.persiana_fechada','on') else 'Aberta' }}"
            icon: mdi:blinds
            color: "{{ 'indigo' if is_state('binary_sensor.persiana_fechada','on') else 'teal' }}"
            tap_action:
              action: none
            grid_options:
              columns: 4
